name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle (fallback)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare and Build APK
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
          fi

          # Если это Expo-проект без папки android, генерируем ее
          if [ ! -d "android" ] && grep -q '"expo"' package.json 2>/dev/null; then
            npx expo prebuild --platform android --non-interactive
          fi

          # Ищем gradlew или build.gradle в репозитории
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            echo "Найден gradlew в: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            GRADLE_FILE=$(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
            if [ -n "$GRADLE_FILE" ]; then
              GRADLE_DIR=$(dirname "$GRADLE_FILE")
              echo "Найден build.gradle в: $GRADLE_DIR, генерируем wrapper..."
              cd "$GRADLE_DIR"
              gradle wrapper
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "ОШИБКА: Файлы Android-проекта не найдены. Содержимое корня:"
              ls -la
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: "**/build/outputs/apk/debug/*.apk"
